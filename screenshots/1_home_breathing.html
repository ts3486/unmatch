    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;

  .sparkle {

  .subheadline {

  .phone-frame {
    width: 780px;
    height: 1600px;
    background: #000;
    border-radius: 100px;
    border: 6px solid #333;
    position: relative;
    overflow: hidden;
    margin-top: 20px;
    box-shadow: 0 40px 120px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.05);
    z-index: 2;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .dynamic-island {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 70px;
    background: #000;
    border-radius: 40px;
    z-index: 10;
  }
  .status-bar {
    height: 110px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 60px 10px;
    color: #fff;
    font-size: 32px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .status-time { font-weight: 700; }
  .status-icons { display: flex; gap: 12px; align-items: center; }
  .status-icons svg { width: 32px; height: 32px; }
  .screen-content {
    flex: 1;
    padding: 20px 44px;
    display: flex;
    flex-direction: column;
    background: #0B1220;
    overflow: hidden;
  }
  .tab-bar {
    height: 140px;
    background: #0B1220;
    border-top: 2px solid #223049;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 30px 30px;
    flex-shrink: 0;
  }
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .tab-item svg { width: 44px; height: 44px; }
  .tab-label {
    font-size: 20px;
    font-weight: 500;
    color: #A7B3C7;
  }
  .tab-item.active .tab-label { color: #4C8DFF; }
  .home-indicator {
    width: 260px;
    height: 8px;
    background: rgba(255,255,255,0.3);
    border-radius: 4px;
    margin: 0 auto 16px;
    flex-shrink: 0;
  }
  .glow-blue {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(76,141,255,0.12) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .glow-purple {
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(168,85,247,0.1) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
